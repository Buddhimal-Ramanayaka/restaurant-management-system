<!--
  Figure 3.6 - Data Flow Diagrams, Level 0 and Level 1.

  Hand-laid-out SVG on the same headless-Chrome pipeline as Fig 3.1, so it carries
  the same palette, Arial type scale and band/box treatment as the rest of
  Chapter 3. The mermaid version could not be made to match: its own node shapes
  and curved edges are a different visual language, and its hub layout collided
  labels that no amount of padding cleared.

  Level 1 is a process/store ladder, not one bottom row of stores. With all five
  stores along the bottom, D1 (used by P2, P4, P5, P6) and D2/D3 (used by P3 and
  P7) forced eleven long parallel runs through a single routing channel. Repeating
  a store beside each process that uses it is standard Gane-Sarson practice and
  removes every long run; a repeat carries the doubled left edge that marks it.

  Process-to-process flows run in four dedicated lanes in the left gutter
  (x = 30, 60, 90, 120) so no connector crosses a process box; each enters its
  target's top edge, leaving the row gap free for its label. Store accesses run in
  the 504..722 gutter, with the jogs kept left of x=556 so the labels clear them.

  Canvas is 1040 units wide inside a 1064px body. At that width the figure sits on
  aspect 0.624, effectively the 0.625 crossover, so width and height bind together
  and the page is filled in both directions. Widening the body to open the label
  gutter therefore cost no printed size at all.
-->

</style>
